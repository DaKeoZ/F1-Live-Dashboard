<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-f1">F1</span>
      <span class="logo-text">Dashboard</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="standings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Pilotes</span>
      </button>
      <button class="nav-item" data-page="constructors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Constructeurs</span>
      </button>
      <button class="nav-item" data-page="results">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="6"/><path d="M8 14l-4 7h16l-4-7"/></svg>
        <span>Résultats</span>
      </button>
      <button class="nav-item" data-page="telemetry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Télémétrie</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="live-indicator" id="liveIndicator">
        <span class="live-dot"></span>
        <span class="live-label">Hors session</span>
      </div>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="page-container" id="pageContainer">
      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Chargement…</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
