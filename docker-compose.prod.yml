# Production — image ghcr.io
# Usage : GHCR_OWNER=dakeoz docker compose -f docker-compose.prod.yml up -d

services:

  backend:
    image: ghcr.io/${GHCR_OWNER}/f1-dashboard-backend:latest
    ports:
      - "127.0.0.1:9797:9797"   # Nginx proxie
    environment:
      OPENF1_USERNAME:     ${OPENF1_USERNAME:-}
      OPENF1_PASSWORD:     ${OPENF1_PASSWORD:-}
      OPENF1_ACCESS_TOKEN: ${OPENF1_ACCESS_TOKEN:-}
      DATA_DIR:            /app/data
    volumes:
      - f1_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9797/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  f1_data:
