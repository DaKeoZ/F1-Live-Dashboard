# Reverse proxy Nginx — F1 Live Dashboard
# Le backend sert à la fois l'API, les WebSockets et la SPA frontend.

server {
    listen 80;
    server_name ton-domaine.com;        # ← à remplacer

    # ── Security ─────────────────────────────────────────────────────────────
    location ~ /\. { return 403; }
    location ~* \.(php|asp|aspx|jsp)$ { return 403; }
    location ~* ^/(kcfinder|filemanager|wp-admin|phpmyadmin|adminer|admin\.php) { return 403; }

    # ── Tout vers le backend (API + SPA + WebSocket) ─────────────────────────
    location / {
        proxy_pass         http://localhost:9797;
        proxy_http_version 1.1;

        # WebSocket (MQTT télémétrie live)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 86400s;   # longue durée pour les WS
        proxy_send_timeout 300s;
    }
}
