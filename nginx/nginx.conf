# Reverse proxy Nginx — F1 Live Dashboard
# Le backend FastAPI sert à la fois l'API, les WebSockets et la SPA frontend.
#
# Pour activer HTTPS avec Certbot :
#   sudo certbot --nginx -d ton-domaine.com

server {
    listen 80;
    server_name ton-domaine.com;

    # ── Security ──────────────────────────────────────────────────────────────
    location ~ /\. { return 403; }
    location ~* \.(php|asp|aspx|jsp)$ { return 403; }
    location ~* ^/(kcfinder|filemanager|wp-admin|phpmyadmin|adminer|admin\.php) { return 403; }

    # ── Tout vers le backend FastAPI (SPA + API + WebSocket MQTT) ─────────────
    location / {
        proxy_pass         http://localhost:9797;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 300s;
    }
}
