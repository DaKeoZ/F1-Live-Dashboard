services:

  backend:
    build:
      context: ./backend
    ports:
      - "9797:9797"
    environment:
      OPENF1_USERNAME:     ${OPENF1_USERNAME:-}
      OPENF1_PASSWORD:     ${OPENF1_PASSWORD:-}
      OPENF1_ACCESS_TOKEN: ${OPENF1_ACCESS_TOKEN:-}
      DATA_DIR:            /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9797/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
